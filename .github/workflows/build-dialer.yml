name: Build signed dialer APK

# GitHub Actions only picks up workflow files at the repo root (.github/workflows),
# so this one lives here and just cd's into the dialer project folder.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'TiQ-M5-T9-Dialer-fork/**'
      - '.github/workflows/build-dialer.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TiQ-M5-T9-Dialer-fork
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Align and sign with the included keystore
        env:
          KS_PASS: m5sdialer
        run: |
          BT="$ANDROID_HOME/build-tools"
          VER=$(ls "$BT" | sort -V | tail -1)
          "$BT/$VER/zipalign" -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app-release-aligned.apk
          "$BT/$VER/apksigner" sign \
            --ks puretech-m5s.jks --ks-pass pass:$KS_PASS \
            --out M5S-T9-Dialer.apk app-release-aligned.apk
          "$BT/$VER/apksigner" verify M5S-T9-Dialer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: M5S-T9-Dialer
          path: TiQ-M5-T9-Dialer-fork/M5S-T9-Dialer.apk
