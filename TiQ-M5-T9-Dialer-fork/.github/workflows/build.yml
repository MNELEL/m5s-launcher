name: Build signed APK

# Runs on GitHub's own cloud servers, with full internet access to Google Maven etc.
# Trigger it manually from the "Actions" tab in your GitHub repo ("Run workflow"),
# or it runs automatically on every push to main.
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Align and sign with the included keystore
        env:
          KS_PASS: m5sdialer
        run: |
          BT="$ANDROID_HOME/build-tools"
          VER=$(ls "$BT" | sort -V | tail -1)
          "$BT/$VER/zipalign" -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app-release-aligned.apk
          "$BT/$VER/apksigner" sign \
            --ks puretech-m5s.jks --ks-pass pass:$KS_PASS \
            --out M5S-T9-Dialer.apk app-release-aligned.apk
          "$BT/$VER/apksigner" verify M5S-T9-Dialer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: M5S-T9-Dialer
          path: M5S-T9-Dialer.apk
